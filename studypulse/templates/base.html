<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyPulse</title>
<link rel="manifest" href="/static/manifest.json">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--ac:#4f46e5}
@media(prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1c1f2b;--tx:#e8eaf2}}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:760px;margin:auto;padding:1rem}
nav{display:flex;justify-content:space-between;align-items:center;padding:1rem;max-width:760px;margin:auto}
.card{background:var(--card);border-radius:12px;padding:1.2rem;margin-bottom:1rem;box-shadow:0 1px 4px #0002}
input{width:100%;padding:.6rem;margin:.3rem 0 .8rem;border-radius:8px;border:1px solid #8885;box-sizing:border-box;background:transparent;color:inherit}
button{background:var(--ac);color:#fff;border:0;padding:.65rem 1.2rem;border-radius:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}.big{font-size:2.5rem;font-weight:700;color:var(--ac)}
.flash{background:#e1141420;padding:.6rem;border-radius:8px;margin-bottom:1rem}
</style></head><body>
<nav><b>📈 StudyPulse</b>{% if session.uid %}<form method="post" action="/logout"><input type="hidden" name="_csrf" value="{{csrf}}"><button>Log out</button></form>{% endif %}</nav>
<main>{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}{% block body %}{% endblock %}</main></body></html>
